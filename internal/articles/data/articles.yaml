articles:
  - id: cat6-cable
    category: 网线
    title: 家用 Cat6 网线怎么选与布放
    summary: 从长度预留到弯曲半径，给家庭和小办公室一套不返工的走线方法。
    audience: 家庭和小办公室
    materials:
      - Cat6 UTP 实心铜网线
      - 线槽或魔术扎带
      - 标签贴纸
      - RJ45 水晶头或信息模块
    steps:
      - 先画出路由器、交换机和各房间信息点的拓扑，按实际路径测量并预留 1 米。
      - 沿墙角或线槽布放，转弯保持至少四倍线径，避免和强电线长距离平行。
      - 两端统一采用 T568B 线序，并在端口与线缆两端贴上同一编号。
    troubleshooting:
      - symptom: 协商速度只有 100 Mbps
        solution: 用测线仪确认八芯都通，再检查水晶头压接是否让护套进入压线位。
      - symptom: 线缆经过弯角后偶发丢包
        solution: 松开过紧的扎带，按四倍线径重新整理弯曲段。
  - id: rj45-crimp
    category: 水晶头
    title: T568B 水晶头压接与线序检查
    summary: 认识八芯排列、护套到位和压接后的自检信号，减少一次性耗材浪费。
    audience: 动手布线的初学者
    materials:
      - Cat6 多股跳线
      - Cat6 兼容 RJ45 水晶头
      - 网线压线钳
      - 线序测试仪
    steps:
      - 剥开外皮约 25 毫米，保持每对双绞尽量靠近水晶头。
      - 从左到右整理为橙白、橙、绿白、蓝、蓝白、绿、棕白、棕。
      - 让八芯顶到水晶头前端、外皮进入压线位后一次压紧，再用测试仪复核。
    troubleshooting:
      - symptom: 测试仪显示跳线或缺针
        solution: 剪掉水晶头重新整理，逐芯确认线序后再压接，不要反复挤压同一个头。
      - symptom: 水晶头卡扣插不进端口
        solution: 检查水晶头规格和护套位置，Cat6 线径过粗时换用匹配的接头。
  - id: switch-layout
    category: 交换机
    title: 小办公室交换机的端口规划
    summary: 用清晰的上联、终端和 PoE 标识，让故障定位从猜测变成查表。
    audience: 4 到 20 人的小办公室
    materials:
      - 千兆非网管交换机
      - 短跳线
      - 端口标签
      - 端口规划表
    steps:
      - 把路由器到交换机的线接到 1 号上联口，给它标记 WAN/LAN 上联。
      - 按座位或房间顺序给终端端口编号，跳线长度以不下垂为准。
      - 接通电源后记录每个端口的链路灯和协商速率，保留一份纸面规划表。
    troubleshooting:
      - symptom: 一排工位同时断网
        solution: 先看交换机上联口链路灯，再沿编号回查弱电箱到交换机的跳线。
      - symptom: 某台设备只能访问内网
        solution: 对照端口规划确认 VLAN 或上联位置，替换跳线排除物理层问题。
  - id: cabinet-basics
    category: 弱电箱
    title: 家庭弱电箱的散热与标签整理
    summary: 在有限空间内排好光猫、路由器和交换机，让后续维护有迹可循。
    audience: 新装家庭网络
    materials:
      - 小型千兆交换机
      - 理线扣和短跳线
      - 端口标签
      - 温度贴或小型温度计
    steps:
      - 先确认光猫、路由器和交换机的电源适配器尺寸，规划设备朝向和散热缝。
      - 光猫到路由器、路由器到交换机分别使用短跳线，避免把电源线压在网线上。
      - 逐个标记房间端口和设备名称，关箱前拍照保存布局。
    troubleshooting:
      - symptom: 夏天网络设备频繁重启
        solution: 检查箱门通风和电源适配器温度，必要时把交换机移到通风位置。
      - symptom: 找不到某个房间的端口
        solution: 断开该端口后用测线仪远端短接，按标签和测试结果重新编号。
